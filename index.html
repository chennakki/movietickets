<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Marquee: book Hollywood movie tickets and choose your seats online.">
<title>Marquee | Book Hollywood movie tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--velvet:#4a101c;--curtain:#220710;--brass:#d9a441;--brass2:#f2cf80;--paper:#f3e7cf;--glow:#fff6dc;--ink:#2b0a12;--muted:#cdaea6;--soft:#6b4a45;
--serif:'Bodoni Moda',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 16px/1.6 var(--sans);color:var(--glow);background:radial-gradient(120% 40% at 50% -6%,#6d1a2d,transparent 62%),var(--curtain);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;text-align:left}
a{color:inherit}
:focus-visible{outline:3px solid var(--brass2);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);background:rgba(34,7,16,.8);border-bottom:1px solid rgba(217,164,65,.25)}
nav .wrap{display:flex;align-items:center;gap:18px;height:68px}
.logo{font:800 28px var(--serif);text-decoration:none;margin-right:auto}
.logo span{color:var(--brass)}
.search input{width:min(280px,36vw);padding:10px 18px;border-radius:99px;border:1.5px solid rgba(217,164,65,.45);background:rgba(255,246,220,.07);color:var(--glow);font:inherit}
.search input::placeholder{color:var(--muted)}
.mytix{border:1.5px solid var(--brass);padding:9px 18px;border-radius:99px;color:var(--brass2);font-weight:500;white-space:nowrap}
.mytix:hover{background:var(--brass);color:var(--ink)}
.btn{display:inline-block;background:linear-gradient(var(--brass2),var(--brass));color:var(--ink);font-weight:700;padding:14px 28px;border-radius:6px;text-decoration:none;text-align:center;box-shadow:0 6px 20px rgba(217,164,65,.3);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:rgba(255,246,220,.08);border:1.5px solid rgba(255,246,220,.5);color:var(--glow);box-shadow:none}
/* poster art: gradient fallback with real image on top */
.art{position:relative;display:flex;align-items:flex-end;aspect-ratio:2/3;padding:16px;overflow:hidden;color:#fff;
background:radial-gradient(circle at var(--x) var(--y),rgba(255,255,255,.55) 0 5%,rgba(255,255,255,.12) 5.5% 13%,transparent 13.5%),radial-gradient(130% 60% at 50% 110%,var(--b),transparent 65%),linear-gradient(172deg,var(--a),var(--c))}
.art b{font:800 26px/1 var(--serif);text-shadow:0 2px 14px rgba(0,0,0,.5)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* hero spotlight */
.spot{position:relative;margin-top:26px;min-height:min(78vh,660px);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:30px;padding:56px 52px 32px;
background:radial-gradient(70% 90% at 78% 20%,var(--b),transparent 62%),linear-gradient(135deg,var(--a),var(--c));box-shadow:0 0 0 1px rgba(217,164,65,.4),0 40px 90px rgba(0,0,0,.55)}
.spot::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(34,7,16,.96) 18%,rgba(34,7,16,.5) 58%,rgba(34,7,16,.1)),linear-gradient(transparent 55%,rgba(34,7,16,.85))}
.spot>*{position:relative;z-index:2}
.spot>.bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;animation:fade .7s}
@keyframes fade{from{opacity:0}}
.sc{max-width:560px;animation:fade .7s}
.sc h1{font:800 clamp(44px,6.2vw,86px)/.98 var(--serif);text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin:18px 0;color:var(--brass2);font-weight:500}
.meta span:first-child{font-weight:700}
.sc p{color:#ecd9d2;font-size:18px;max-width:48ch;margin-bottom:28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.ths{display:flex;gap:12px;align-items:flex-end;overflow-x:auto;padding:4px 2px}
.th{width:62px;flex:none;border-radius:8px;overflow:hidden;opacity:.6;border:2px solid transparent;transition:.2s}
.th .art{padding:0}.th .art b{display:none}
.th:hover{opacity:1}
.th[aria-pressed=true]{opacity:1;border-color:var(--brass2);transform:translateY(-6px)}
/* catalogue */
.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;margin:70px 0 30px}
h2{font:600 40px/1.1 var(--serif)}
.bar p{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 18px;border:1.5px solid rgba(217,164,65,.45);border-radius:99px;color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--brass);color:var(--glow)}
.chip[aria-pressed=true]{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:34px 26px;padding-bottom:90px}
.empty{grid-column:1/-1;color:var(--muted)}
.card h3{font:600 20px/1.25 var(--serif);margin-top:14px}
.card small{color:var(--muted)}
.pw{display:block;width:100%;position:relative;border-radius:12px;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,.45);transition:transform .25s,box-shadow .25s}
.pw:hover,.pw:focus-visible{transform:translateY(-8px);box-shadow:0 26px 50px rgba(0,0,0,.6),0 0 0 2px var(--brass)}
.ov{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:16px;background:linear-gradient(transparent 45%,rgba(34,7,16,.95));opacity:0;transition:opacity .2s}
.pw:hover .ov,.pw:focus-visible .ov{opacity:1}
.ov em{font-style:normal;font-size:13px;color:var(--muted)}
.ov strong{background:var(--brass);color:var(--ink);text-align:center;padding:10px;border-radius:6px}
.badge{position:absolute;z-index:3;top:12px;right:12px;background:rgba(20,4,8,.7);backdrop-filter:blur(4px);padding:3px 11px;border-radius:99px;font-size:13px;font-weight:700;color:var(--brass2)}
footer{border-top:1px solid rgba(217,164,65,.25);padding:28px 0 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* booking dialog */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(980px,96vw);border-radius:14px;overflow:hidden;margin:auto;box-shadow:0 40px 100px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(20,4,8,.86);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
.dg{display:grid;grid-template-columns:260px 1fr;height:min(90vh,740px)}
.dg>aside{background:var(--velvet);color:var(--glow);padding:24px;overflow:auto}
.dg>aside .art{border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.5)}
.dg>aside h4{font:800 22px/1.15 var(--serif);margin:18px 0 4px}
.dg>aside small{color:var(--muted);display:block}
.dg>aside p{font-size:14px;color:#ecd9d2;margin-top:12px}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.mh{padding:20px 28px 0;border-bottom:1px solid rgba(43,10,18,.15)}
.mh .t{display:flex;justify-content:space-between;gap:12px;align-items:start}
.mh h3{font:800 28px/1.1 var(--serif)}
.mh small{color:var(--soft)}
.x{font-size:30px;line-height:1;padding:0 6px}
.steps{display:flex;gap:6px;margin-top:16px;padding:0}
.steps li{flex:1;list-style:none;font-size:13px;padding:8px 0 10px;color:var(--soft);border-bottom:3px solid rgba(43,10,18,.12)}
.steps li.on{color:var(--ink);border-color:var(--brass);font-weight:700}
.steps li.ok{border-color:var(--brass)}
.mb{padding:24px 28px;overflow:auto;flex:1}
.lbl{font-weight:700;margin:18px 0 10px}
.lbl:first-child{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 18px;border:1.5px solid var(--ink);border-radius:6px;transition:.15s}
.opt:hover{background:rgba(43,10,18,.08)}
.opt[aria-pressed=true]{background:var(--ink);color:var(--glow)}
.opt small{display:block;font-size:12px;opacity:.7}
.screen{height:40px;margin:4px 14% 26px;background:linear-gradient(var(--brass),transparent);border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.75;text-align:center;font-size:12px;letter-spacing:.35em;padding-top:8px}
.seats{display:grid;gap:7px;justify-content:center;overflow-x:auto;padding-bottom:8px}
.row{display:flex;gap:6px;align-items:center}
.row em{width:16px;font-size:12px;font-style:normal;color:var(--soft)}
.seat{width:28px;height:27px;border-radius:8px 8px 3px 3px;background:#fff;border:1.5px solid var(--ink);flex:none;transition:transform .1s}
.seat:hover:not(:disabled){transform:scale(1.15)}
.seat.p{border-color:var(--brass);box-shadow:inset 0 -4px 0 var(--brass)}
.seat.t{background:#b9aa90;border-color:#b9aa90;cursor:not-allowed}
.seat.s{background:var(--velvet);border-color:var(--velvet);box-shadow:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:16px;justify-content:center}
.legend span:before{content:"";display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:7px;vertical-align:-2px;border:1.5px solid var(--ink)}
.l1:before{background:#fff}.l2:before{background:var(--velvet)}.l3:before{background:#b9aa90;border-color:#b9aa90}.l4:before{border-color:var(--brass);box-shadow:inset 0 -3px 0 var(--brass)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 28px;border-top:2px dashed rgba(43,10,18,.3);background:var(--paper)}
.foot small{color:var(--soft);display:block}
.foot strong{font:800 28px/1 var(--serif)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{font-size:14px;font-weight:500;display:grid;gap:6px}
.form .w{grid-column:1/-1}
input.f{font:inherit;padding:12px 14px;border:1.5px solid rgba(43,10,18,.5);border-radius:6px;width:100%;background:#fff;color:var(--ink)}
.note{font-size:13px;color:var(--soft);margin-top:14px}
.ticket{display:grid;grid-template-columns:1fr auto;gap:20px;background:#fff9ea;border:2px solid var(--ink);border-radius:10px;padding:22px}
.ticket h4{font:800 28px/1.1 var(--serif)}
.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin-top:12px}
.ticket dt{color:var(--soft)}
.qr{width:116px;height:116px;display:grid;grid-template-columns:repeat(11,1fr);gap:1px;align-self:center;padding:6px;background:#fff;border:1px solid rgba(43,10,18,.3)}
.qr i{background:var(--ink)}.qr i.o{background:transparent}
.ok-msg{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.tick{width:46px;height:46px;border-radius:50%;background:var(--brass);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.list{display:grid;gap:16px;align-content:start}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--glow);padding:12px 22px;border-radius:99px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .2s}
@media(max-width:860px){.spot{padding:36px 22px 22px}.search{display:none}.dg{grid-template-columns:1fr}.dg>aside{display:none}}
@media(max-width:560px){.form,.ticket{grid-template-columns:1fr}.mb,.mh,.foot{padding-left:18px;padding-right:18px}.steps li{font-size:11px}.wrap{padding:0 16px}.grid{grid-template-columns:repeat(2,1fr);gap:26px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="logo" href="#">Mar<span>quee</span></a>
  <div class="search"><input id="q" type="search" placeholder="Search movies" aria-label="Search movies"></div>
  <button class="mytix" id="mytix">My tickets (0)</button>
</div></nav>
<main class="wrap">
  <section class="spot" id="spot" aria-label="Featured movie"></section>
  <section id="movies" aria-labelledby="h-now">
    <div class="bar"><div><h2 id="h-now">Now showing</h2><p>Ten Hollywood hits on screen this week.</p></div><div class="chips" id="chips"></div></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<footer><div class="wrap"><span>Marquee &copy; 2026. Showtimes, seats and payments are simulated.</span><span>Movie data and images courtesy of TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</span></div></footer>
<dialog id="dlg" aria-labelledby="dt"></dialog>
<script>
/* Paste your free TMDB API key (themoviedb.org/settings/api) to load real posters and backdrops.
   Without a key, the page looks for local files: posters/<slug>.jpg and backdrops/<slug>.jpg, e.g. posters/dune-part-two.jpg */
const TMDB_KEY="";
const MOVIES=[
{id:1,t:"Dune: Part Two",g:"Sci-Fi",y:2024,d:166,r:"PG-13",s:8.5,q:"Paul Atreides joins the Fremen and wages war against the empire that destroyed his family.",a:"#d98a3d",b:"#f2b66d",c:"#3a1608",x:"72%",y:"30%"},
{id:2,t:"Oppenheimer",g:"Drama",y:2023,d:180,r:"R",s:8.3,q:"The story of J. Robert Oppenheimer and the creation of the atomic bomb.",a:"#e2863a",b:"#ffcf8a",c:"#1d1008",x:"50%",y:"46%"},
{id:3,t:"Inception",g:"Sci-Fi",y:2010,d:148,r:"PG-13",s:8.8,q:"A thief who steals secrets from dreams is offered one last job: plant an idea.",a:"#5f93a3",b:"#a8d4de",c:"#0d1c24",x:"28%",y:"26%"},
{id:4,t:"Interstellar",g:"Sci-Fi",y:2014,d:169,r:"PG-13",s:8.7,q:"Explorers travel through a wormhole to find a new home for humanity.",a:"#7a68e0",b:"#c1b6ff",c:"#0e0b2a",x:"66%",y:"40%"},
{id:5,t:"The Dark Knight",g:"Action",y:2008,d:152,r:"PG-13",s:9.0,q:"Batman faces the Joker, who pushes Gotham City into chaos.",a:"#6d7f90",b:"#b7c6d4",c:"#0a0f14",x:"76%",y:"22%"},
{id:6,t:"Top Gun: Maverick",g:"Action",y:2022,d:130,r:"PG-13",s:8.2,q:"After thirty years, Maverick trains a new generation of elite pilots for a near-impossible mission.",a:"#f0a93f",b:"#ffd98a",c:"#7a2d12",x:"34%",y:"34%"},
{id:7,t:"La La Land",g:"Romance",y:2016,d:128,r:"PG-13",s:8.0,q:"A jazz pianist and an aspiring actress chase their dreams in Los Angeles.",a:"#d055a8",b:"#ff9fd8",c:"#2a0f4a",x:"58%",y:"28%"},
{id:8,t:"Barbie",g:"Comedy",y:2023,d:114,r:"PG-13",s:6.9,q:"Barbie leaves Barbieland for the real world and finds out who she wants to be.",a:"#f26aae",b:"#ffb3d9",c:"#8a1c5c",x:"40%",y:"38%"},
{id:9,t:"Avatar: The Way of Water",g:"Sci-Fi",y:2022,d:192,r:"PG-13",s:7.6,q:"Jake Sully and his family flee to the ocean clans of Pandora to escape a returning threat.",a:"#2aa8b8",b:"#8defe0",c:"#07283a",x:"62%",y:"34%"},
{id:10,t:"Spider-Man: Across the Spider-Verse",g:"Animation",y:2023,d:140,r:"PG",s:8.4,q:"Miles Morales swings across the multiverse and meets a team of Spider-People.",a:"#e0344f",b:"#ff8aa0",c:"#1a1048",x:"30%",y:"30%"}];
const IMG="https://image.tmdb.org/t/p/",slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
MOVIES.forEach(m=>{m.p=`posters/${slug(m.t)}.jpg`;m.k=`backdrops/${slug(m.t)}.jpg`});
const TIMES=["10:30","13:15","16:00","19:20","22:10"],FMT={Standard:1,Dolby:1.25,IMAX:1.5};
const BASE={A:11,B:11,C:11,D:14,E:14,F:14,G:18,H:18},ROWS="ABCDEFGH",COLS=12,STEPS=["Showtime","Seats","Payment","Ticket"];
const $=s=>document.querySelector(s),dlg=$("#dlg");
let st={},filter="All",query="",spot=0,tickets=JSON.parse(localStorage.getItem("mq_tix")||"[]");
const money=n=>"$"+n.toFixed(2),esc=s=>s.replace(/[<>&"]/g,""),dur=m=>`${Math.floor(m.d/60)}h ${m.d%60}m`;
const dl=k=>new Date(k+"T00:00").toLocaleDateString("en",{weekday:"short",day:"numeric",month:"short"});
const days=()=>[...Array(5)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);const k=d.toISOString().slice(0,10);return{k,l:i?dl(k):"Today"}});
function seeded(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>(h=Math.imul(h^h>>>15,2246822507)^Math.imul(h^h>>>13,3266489909),(h>>>0)/4294967296)}
const sold=()=>{const r=seeded(""+st.m.id+st.day+st.time+st.fmt),s=new Set;for(const a of ROWS)for(let c=1;c<=COLS;c++)if(r()<.28)s.add(a+c);return s};
const price=s=>BASE[s[0]]*FMT[st.fmt],total=()=>st.seats.reduce((a,s)=>a+price(s),0);
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;(dlg.open?dlg:document.body).append(t);setTimeout(()=>t.remove(),2600)}
const art=m=>`<span class="art" style="--a:${m.a};--b:${m.b};--c:${m.c};--x:${m.x};--y:${m.y}"><b>${m.t}</b><img src="${m.p}" alt="${m.t} poster" loading="lazy" onerror="this.remove()"></span>`;
function hero(i){spot=i;const m=MOVIES[i],e=$("#spot");e.style.cssText=`--a:${m.a};--b:${m.b};--c:${m.c}`;
e.innerHTML=`<img class="bg" src="${m.k}" alt="" onerror="this.remove()"><div class="sc"><h1>${m.t}</h1><div class="meta"><span>&#9733; ${m.s}</span><span>${m.y}</span><span>${dur(m)}</span><span>${m.r}</span><span>${m.g}</span></div><p>${m.q}</p>
<div class="cta"><button class="btn" data-id="${m.id}">Book tickets</button><a class="btn ghost" href="#movies">Browse all movies</a></div></div>
<div class="ths" role="group" aria-label="Choose featured movie">${MOVIES.map((x,j)=>`<button class="th" data-spot="${j}" aria-pressed="${j==i}" aria-label="Feature ${x.t}">${art(x)}</button>`).join("")}</div>`}
const card=m=>`<article class="card"><button class="pw" data-id="${m.id}" aria-label="Get tickets for ${m.t}">${art(m)}<span class="badge">&#9733; ${m.s}</span><span class="ov"><em>${dur(m)} &middot; ${m.r}</em><strong>Get tickets</strong></span></button><h3>${m.t}</h3><small>${m.g} &middot; ${m.y}</small></article>`;
function renderChips(){const gs=["All",...new Set(MOVIES.map(m=>m.g))];$("#chips").innerHTML=gs.map(g=>`<button class="chip" aria-pressed="${g==filter}" data-g="${g}">${g}</button>`).join("")}
function renderGrid(){const l=MOVIES.filter(m=>(filter=="All"||m.g==filter)&&m.t.toLowerCase().includes(query));$("#grid").innerHTML=l.length?l.map(card).join(""):`<p class="empty">No movies match "${esc(query)}". Try another title or clear the genre filter.</p>`}
async function loadArt(){if(!TMDB_KEY)return;await Promise.all(MOVIES.map(async m=>{try{const j=await(await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(m.t)}&year=${m.y}`)).json(),r=j.results&&j.results[0];
if(r){if(r.poster_path)m.p=IMG+"w500"+r.poster_path;if(r.backdrop_path)m.k=IMG+"w1280"+r.backdrop_path;if(r.vote_average)m.s=+r.vote_average.toFixed(1)}}catch(e){}}));renderGrid();hero(spot)}
function open(id){st={m:MOVIES.find(m=>m.id==id),day:days()[0].k,time:null,fmt:"Standard",seats:[],step:1};render();dlg.showModal()}
const side=m=>`<aside>${art(m)}<h4>${m.t}</h4><small>${m.y} &middot; ${dur(m)} &middot; ${m.r}</small><p>${m.q}</p></aside>`;
const head=sub=>`<div class="mh"><div class="t"><div><h3 id="dt">${st.m.t}</h3><small>${sub}</small></div><button class="x" aria-label="Close" data-close>&times;</button></div>
<ol class="steps">${STEPS.map((s,i)=>`<li class="${i+1==st.step?"on":i+1<st.step?"ok":""}">${i+1}. ${s}</li>`).join("")}</ol></div>`;
function bar(){const n=st.step,next=n==1?`<button class="btn" data-next="2" ${st.time?"":"disabled"}>Choose seats</button>`:n==2?`<button class="btn" data-next="3" ${st.seats.length?"":"disabled"}>Continue</button>`:`<button class="btn" data-pay>Pay ${money(total())}</button>`;
return`<div><small>${n==1?(st.time?dl(st.day)+", "+st.time+", "+st.fmt:"Select a showtime"):st.seats.length?st.seats.join(", "):"No seats selected"}</small><strong>${n==1?"":money(total())}</strong></div><div class="opts">${n>1?`<button class="opt" data-next="${n-1}">Back</button>`:""}${next}</div>`}
function render(){const n=st.step;let b="";const sub=["Choose a date, format and showtime","Pick your seats",`${dl(st.day)}, ${st.time}, ${st.fmt}`][n-1];
if(n==1)b=`<div class="lbl">Date</div><div class="opts">${days().map(d=>`<button class="opt" data-day="${d.k}" aria-pressed="${d.k==st.day}">${d.l}</button>`).join("")}</div>
<div class="lbl">Format</div><div class="opts">${Object.keys(FMT).map(f=>`<button class="opt" data-fmt="${f}" aria-pressed="${f==st.fmt}">${f}<small>from ${money(11*FMT[f])}</small></button>`).join("")}</div>
<div class="lbl">Showtime</div><div class="opts">${TIMES.map(t=>`<button class="opt" data-time="${t}" aria-pressed="${t==st.time}">${t}</button>`).join("")}</div>`;
if(n==2){const t=sold();b=`<div class="screen">SCREEN</div><div class="seats">${[...ROWS].map(r=>`<div class="row"><em>${r}</em>${[...Array(COLS)].map((_,i)=>{const id=r+(i+1),tk=t.has(id),sel=st.seats.includes(id);
return`<button class="seat ${"GH".includes(r)?"p":""} ${tk?"t":""} ${sel?"s":""}" data-seat="${id}" ${tk?"disabled":""} aria-label="Seat ${id}, ${money(price(id))}${tk?", taken":""}" aria-pressed="${sel}"></button>`+(i==5?'<span style="width:16px"></span>':"")}).join("")}</div>`).join("")}</div>
<div class="legend"><span class="l1">Available</span><span class="l2">Selected</span><span class="l3">Taken</span><span class="l4">Premium (G-H)</span></div>`}
if(n==3)b=`<div class="form"><label>Full name<input class="f" id="nm" autocomplete="name"></label><label>Email<input class="f" id="em" type="email" autocomplete="email"></label>
<label class="w">Card number<input class="f" id="cn" inputmode="numeric" autocomplete="off" placeholder="4242 4242 4242 4242" maxlength="19"></label>
<label>Expiry<input class="f" placeholder="MM/YY" maxlength="5"></label><label>CVC<input class="f" inputmode="numeric" maxlength="4" placeholder="123"></label></div>
<p class="note">Demo checkout: no payment is taken and card details are not stored.</p>`;
dlg.innerHTML=`<div class="dg">${side(st.m)}<div class="main">${head(sub)}<div class="mb">${b}</div><div class="foot" id="bar">${bar()}</div></div></div>`}
function qr(c){const r=seeded(c);return`<div class="qr" aria-hidden="true">${[...Array(121)].map(()=>`<i class="${r()<.5?"o":""}"></i>`).join("")}</div>`}
const tix=b=>`<div class="ticket"><div><h4>${b.t}</h4><dl><dt>When</dt><dd>${dl(b.day)}, ${b.time}</dd><dt>Format</dt><dd>${b.fmt}</dd><dt>Seats</dt><dd>${b.seats.join(", ")}</dd><dt>Paid</dt><dd>${money(b.total)}</dd><dt>Booking</dt><dd>${b.id}</dd></dl></div>${qr(b.id)}</div>`;
function pay(btn){const nm=$("#nm").value.trim(),em=$("#em").value.trim(),cn=$("#cn").value.replace(/\D/g,"");
if(!nm)return toast("Enter your full name.");if(!/^\S+@\S+\.\S+$/.test(em))return toast("Enter a valid email address.");if(cn.length<13)return toast("Enter a valid card number.");
btn.disabled=true;btn.textContent="Processing...";
setTimeout(()=>{const b={id:"MQ"+Math.random().toString(36).slice(2,8).toUpperCase(),t:st.m.t,day:st.day,time:st.time,fmt:st.fmt,seats:[...st.seats],total:total()};
tickets.push(b);localStorage.setItem("mq_tix",JSON.stringify(tickets));count();st.step=4;
dlg.innerHTML=`<div class="dg">${side(st.m)}<div class="main">${head("Booking confirmed")}<div class="mb"><div class="ok-msg"><div class="tick">&#10003;</div><p>Thanks, ${esc(nm.split(" ")[0])}. Show this code at the door. A copy is saved under My tickets.</p></div>${tix(b)}</div><div class="foot"><span></span><button class="btn" data-close>Done</button></div></div></div>`},900)}
function mine(){dlg.innerHTML=`<div class="dg" style="grid-template-columns:1fr"><div class="main"><div class="mh" style="padding-bottom:16px"><div class="t"><h3 id="dt">My tickets</h3><button class="x" aria-label="Close" data-close>&times;</button></div></div><div class="mb list">${tickets.length?tickets.slice().reverse().map(tix).join(""):"<p>No tickets yet. Pick a movie to book your first seats.</p>"}</div></div></div>`;dlg.showModal()}
const count=()=>$("#mytix").textContent=`My tickets (${tickets.length})`;
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if(d.g){filter=d.g;renderChips();renderGrid()}
else if(d.spot)hero(+d.spot);
else if(d.id)open(d.id);
else if("close"in d)dlg.close();
else if(d.day){st.day=d.day;st.seats=[];render()}
else if(d.fmt){st.fmt=d.fmt;st.seats=[];render()}
else if(d.time){st.time=d.time;st.seats=[];render()}
else if(d.next){st.step=+d.next;render()}
else if(d.seat){const i=st.seats.indexOf(d.seat);if(i>-1)st.seats.splice(i,1);else if(st.seats.length<8)st.seats.push(d.seat);else return toast("You can book up to 8 seats at a time.");
t.classList.toggle("s");t.setAttribute("aria-pressed",i<0);$("#bar").innerHTML=bar()}
else if("pay"in d)pay(t);
else if(t.id=="mytix")mine()});
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.addEventListener("input",e=>{if(e.target.id=="q"){query=e.target.value.trim().toLowerCase();renderGrid()}
if(e.target.id=="cn")e.target.value=e.target.value.replace(/\D/g,"").slice(0,16).replace(/(.{4})/g,"$1 ").trim()});
hero(0);renderChips();renderGrid();count();loadArt();
</script>
</body>
</html>
