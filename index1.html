<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee — Book Hollywood movie tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--velvet:#4a101c;--curtain:#2b0a12;--brass:#d9a441;--paper:#f3e7cf;--glow:#fff6dc;--ink:#2b0a12;--muted:#c9a9a0;
--serif:'Bodoni Moda',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:400 16px/1.55 var(--sans);color:var(--glow);background:var(--curtain);
background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 36px,transparent 36px 72px)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.logo{font:800 28px var(--serif);letter-spacing:.02em}
.logo span{color:var(--brass)}
.mytix{border:1.5px solid var(--brass);padding:8px 16px;border-radius:99px;color:var(--brass);font-weight:500}
/* hero: the marquee sign */
.sign{margin:14px 0 48px;padding:48px 28px;text-align:center;background:var(--velvet);border-radius:6px;position:relative;
box-shadow:0 0 0 6px var(--curtain),0 0 0 8px var(--brass),0 30px 80px rgba(0,0,0,.5)}
.sign::before{content:"";position:absolute;inset:12px;border:6px dotted var(--brass);border-radius:3px;opacity:.9;animation:bulbs 2.4s steps(2) infinite}
@keyframes bulbs{50%{border-color:#f7d98b;opacity:.6}}
.sign h1{font:800 clamp(40px,8vw,92px)/.98 var(--serif);text-wrap:balance}
.sign p{max-width:46ch;margin:18px auto 26px;color:var(--muted);font-size:18px}
.btn{background:var(--brass);color:var(--ink);font-weight:700;padding:13px 26px;border-radius:4px;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:22px}
h2{font:600 34px var(--serif)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 16px;border:1.5px solid rgba(217,164,65,.5);border-radius:99px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;padding-bottom:70px}
/* ticket stub card */
.stub{background:var(--paper);color:var(--ink);border-radius:8px;text-align:left;display:flex;flex-direction:column;overflow:hidden;
-webkit-mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
transition:transform .2s}
.stub:hover{transform:translateY(-6px) rotate(-.6deg)}
.poster{aspect-ratio:3/3.6;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.poster b{font:800 30px/1 var(--serif);color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.poster i{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.45);color:#fff;font-style:normal;padding:3px 10px;border-radius:99px;font-size:13px}
.info{padding:16px 18px 18px;border-top:2px dashed rgba(43,10,18,.35);display:flex;flex-direction:column;gap:4px;flex:1}
.info small{color:#6b4a45}
.info .btn{margin-top:10px;background:var(--velvet);color:var(--glow)}
/* modal */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(760px,96vw);max-height:94vh;border-radius:10px;overflow:auto;margin:auto}
dialog::backdrop{background:rgba(20,4,8,.82)}
dialog[open]{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.mh{background:var(--velvet);color:var(--glow);padding:20px 24px;display:flex;justify-content:space-between;gap:12px}
.mh h3{font:800 28px var(--serif)}
.mh small{color:var(--muted)}
.x{font-size:28px;line-height:1;padding:0 6px}
.mb{padding:22px 24px}
.lbl{font-weight:700;margin:14px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 16px;border:1.5px solid var(--ink);border-radius:4px}
.opt[aria-pressed=true]{background:var(--ink);color:var(--glow)}
.screen{height:34px;margin:18px 12% 22px;background:linear-gradient(var(--brass),transparent);border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.7;text-align:center;font-size:12px;color:var(--ink);letter-spacing:.3em;padding-top:6px}
.seats{display:grid;gap:6px;justify-content:center;overflow-x:auto;padding-bottom:6px}
.row{display:flex;gap:6px;align-items:center}
.row em{width:16px;font-size:12px;font-style:normal;color:#6b4a45}
.seat{width:26px;height:26px;border-radius:6px 6px 3px 3px;background:#fff;border:1.5px solid var(--ink);flex:none}
.seat.p{border-color:var(--brass);box-shadow:inset 0 -3px 0 var(--brass)}
.seat.t{background:#b9aa90;border-color:#b9aa90;cursor:not-allowed}
.seat.s{background:var(--velvet);border-color:var(--velvet)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:14px;justify-content:center}
.legend span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1.5px solid var(--ink)}
.l1:before{background:#fff}.l2:before{background:var(--velvet)}.l3:before{background:#b9aa90}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:2px dashed rgba(43,10,18,.35);gap:12px}
.foot strong{font:800 26px var(--serif)}
.ticket{border:2px solid var(--ink);border-radius:8px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px;background:#fff9ea}
.ticket h4{font:800 26px var(--serif)}
.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px}
.ticket dt{color:#6b4a45}
.qr{width:112px;height:112px;display:grid;grid-template-columns:repeat(11,1fr);gap:1px;align-self:center}
.qr i{background:var(--ink)}.qr i.o{background:transparent}
input{font:inherit;padding:10px 12px;border:1.5px solid var(--ink);border-radius:4px;width:100%;background:#fff;color:var(--ink)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.form,.ticket{grid-template-columns:1fr}.sign{padding:36px 16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Mar<span>quee</span></div>
    <button class="mytix" id="mytix">My tickets (0)</button>
  </header>
  <section class="sign">
    <h1>Tonight, the big screen is yours</h1>
    <p>Pick a film, choose your seats, and walk in with a ticket in hand. No queues, no fees.</p>
    <a href="#movies"><button class="btn">Browse movies</button></a>
  </section>
  <section id="movies">
    <div class="bar"><h2>Now showing</h2><div class="chips" id="chips"></div></div>
    <div class="grid" id="grid"></div>
  </section>
</div>
<dialog id="dlg" aria-labelledby="dt"></dialog>
<script>
const MOVIES=[
{id:1,t:"Dune: Part Two",g:"Sci-Fi",y:2024,d:166,r:"PG-13",s:8.5,c:["#c2692b","#3a1608"]},
{id:2,t:"Oppenheimer",g:"Drama",y:2023,d:180,r:"R",s:8.3,c:["#e2863a","#1d1008"]},
{id:3,t:"Inception",g:"Sci-Fi",y:2010,d:148,r:"PG-13",s:8.8,c:["#4f7c8a","#0d1c24"]},
{id:4,t:"Interstellar",g:"Sci-Fi",y:2014,d:169,r:"PG-13",s:8.7,c:["#6a5acd","#0e0b2a"]},
{id:5,t:"The Dark Knight",g:"Action",y:2008,d:152,r:"PG-13",s:9.0,c:["#5b6b7a","#0a0f14"]},
{id:6,t:"Top Gun: Maverick",g:"Action",y:2022,d:130,r:"PG-13",s:8.2,c:["#e5a13b","#7a2d12"]},
{id:7,t:"La La Land",g:"Romance",y:2016,d:128,r:"PG-13",s:8.0,c:["#c04e9a","#2a0f4a"]},
{id:8,t:"Barbie",g:"Comedy",y:2023,d:114,r:"PG-13",s:6.9,c:["#ee5fa7","#8a1c5c"]}];
const TIMES=["10:30","13:15","16:00","19:20","22:10"],FMT={"Standard":1,"Dolby":1.25,"IMAX":1.5};
const BASE={A:11,B:11,C:11,D:14,E:14,F:14,G:18,H:18},ROWS="ABCDEFGH",COLS=12;
const $=s=>document.querySelector(s),dlg=$("#dlg");
let st={},filter="All",tickets=JSON.parse(localStorage.getItem("mq_tix")||"[]");
const money=n=>"$"+n.toFixed(2);
function days(){return[...Array(5)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return{k:d.toISOString().slice(0,10),l:i?d.toLocaleDateString("en",{weekday:"short",day:"numeric",month:"short"}):"Today"}})}
function seeded(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>((h=Math.imul(h^h>>>15,2246822507)^Math.imul(h^h>>>13,3266489909),(h>>>0)/4294967296))}
function sold(){const r=seeded(st.m.id+st.day+st.time+st.fmt);const s=new Set;ROWS.split("").forEach(a=>{for(let c=1;c<=COLS;c++)if(r()<.28)s.add(a+c)});return s}
function renderChips(){const gs=["All",...new Set(MOVIES.map(m=>m.g))];$("#chips").innerHTML=gs.map(g=>`<button class="chip" aria-pressed="${g==filter}" data-g="${g}">${g}</button>`).join("")}
function renderGrid(){$("#grid").innerHTML=MOVIES.filter(m=>filter=="All"||m.g==filter).map(m=>`
<article class="stub"><div class="poster" style="background:radial-gradient(circle at 30% 20%,${m.c[0]},${m.c[1]} 75%)"><i>★ ${m.s}</i><b>${m.t}</b></div>
<div class="info"><strong>${m.g} · ${m.y}</strong><small>${Math.floor(m.d/60)}h ${m.d%60}m · Rated ${m.r}</small><button class="btn" data-id="${m.id}">Get tickets</button></div></article>`).join("")}
function open(id){st={m:MOVIES.find(m=>m.id==id),day:days()[0].k,time:null,fmt:"Standard",seats:[]};step1();dlg.showModal()}
function head(sub){return`<div class="mh"><div><h3 id="dt">${st.m.t}</h3><small>${sub}</small></div><button class="x" aria-label="Close" data-close>×</button></div>`}
function step1(){dlg.innerHTML=head("Choose a date, format and showtime")+`<div class="mb">
<div class="lbl">Date</div><div class="opts">${days().map(d=>`<button class="opt" data-day="${d.k}" aria-pressed="${d.k==st.day}">${d.l}</button>`).join("")}</div>
<div class="lbl">Format</div><div class="opts">${Object.keys(FMT).map(f=>`<button class="opt" data-fmt="${f}" aria-pressed="${f==st.fmt}">${f}</button>`).join("")}</div>
<div class="lbl">Showtime</div><div class="opts">${TIMES.map(t=>`<button class="opt" data-time="${t}" aria-pressed="${t==st.time}">${t}</button>`).join("")}</div>
<div class="foot"><span></span><button class="btn" data-next="2" ${st.time?"":"disabled"}>Choose seats</button></div></div>`}
function price(s){return BASE[s[0]]*FMT[st.fmt]}
function total(){return st.seats.reduce((a,s)=>a+price(s),0)}
function step2(){const t=sold();dlg.innerHTML=head(`${st.day} · ${st.time} · ${st.fmt}`)+`<div class="mb"><div class="screen">SCREEN</div><div class="seats">
${ROWS.split("").map(r=>`<div class="row"><em>${r}</em>${[...Array(COLS)].map((_,i)=>{const id=r+(i+1),tk=t.has(id),sel=st.seats.includes(id);
return`<button class="seat ${"GH".includes(r)?"p":""} ${tk?"t":""} ${sel?"s":""}" data-seat="${id}" ${tk?"disabled":""} aria-label="Seat ${id}, ${money(price(id))}" aria-pressed="${sel}"></button>`+(i==5?'<span style="width:14px"></span>':"")}).join("")}</div>`).join("")}</div>
<div class="legend"><span class="l1">Available</span><span class="l2">Yours</span><span class="l3">Taken</span><span style="color:#8a6414">Gold edge = premium rows</span></div>
<div class="foot"><div><small>${st.seats.length?st.seats.join(", "):"No seats selected"}</small><br><strong>${money(total())}</strong></div>
<div class="opts"><button class="opt" data-next="1">Back</button><button class="btn" data-next="3" ${st.seats.length?"":"disabled"}>Continue</button></div></div></div>`}
function step3(){dlg.innerHTML=head("Your details")+`<div class="mb"><div class="form">
<label>Full name<input id="nm" autocomplete="name"></label><label>Email<input id="em" type="email" autocomplete="email"></label>
<label>Card number<input id="cn" inputmode="numeric" placeholder="Demo only — no real payment" maxlength="19"></label><label>Expiry<input placeholder="MM/YY" maxlength="5"></label></div>
<div class="foot"><div><small>${st.seats.length} seat${st.seats.length>1?"s":""} · ${st.fmt}</small><br><strong>${money(total())}</strong></div>
<div class="opts"><button class="opt" data-next="2">Back</button><button class="btn" data-pay>Pay ${money(total())}</button></div></div></div>`}
function qr(code){const r=seeded(code);return`<div class="qr">${[...Array(121)].map(()=>`<i class="${r()<.5?"o":""}"></i>`).join("")}</div>`}
function ticketHTML(b){return`<div class="ticket"><div><h4>${b.t}</h4><dl><dt>When</dt><dd>${b.day}, ${b.time}</dd><dt>Format</dt><dd>${b.fmt}</dd><dt>Seats</dt><dd>${b.seats.join(", ")}</dd><dt>Paid</dt><dd>${money(b.total)}</dd><dt>Booking</dt><dd>${b.id}</dd></dl></div>${qr(b.id)}</div>`}
function done(){const nm=$("#nm").value.trim(),em=$("#em").value.trim();
if(!nm||!/^\S+@\S+\.\S+$/.test(em)){alert("Enter your name and a valid email to continue.");return}
const b={id:"MQ"+Math.random().toString(36).slice(2,8).toUpperCase(),t:st.m.t,day:st.day,time:st.time,fmt:st.fmt,seats:[...st.seats],total:total()};
tickets.push(b);localStorage.setItem("mq_tix",JSON.stringify(tickets));count();
dlg.innerHTML=head("Booking confirmed")+`<div class="mb"><p style="margin-bottom:14px">Thanks, ${nm.split(" ")[0]}. Show this code at the door. A copy is saved under My tickets.</p>${ticketHTML(b)}<div class="foot"><span></span><button class="btn" data-close>Done</button></div></div>`}
function mine(){dlg.innerHTML=`<div class="mh"><h3 id="dt">My tickets</h3><button class="x" aria-label="Close" data-close>×</button></div><div class="mb" style="display:grid;gap:14px">${tickets.length?tickets.slice().reverse().map(ticketHTML).join(""):"<p>No tickets yet. Pick a movie to book your first seats.</p>"}</div>`;dlg.showModal()}
function count(){$("#mytix").textContent=`My tickets (${tickets.length})`}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if(d.g){filter=d.g;renderChips();renderGrid()}
else if(d.id)open(d.id);
else if("close"in d)dlg.close();
else if(d.day){st.day=d.day;st.seats=[];step1()}
else if(d.fmt){st.fmt=d.fmt;st.seats=[];step1()}
else if(d.time){st.time=d.time;st.seats=[];step1()}
else if(d.next){({1:step1,2:step2,3:step3})[d.next]()}
else if(d.seat){const i=st.seats.indexOf(d.seat);if(i>-1)st.seats.splice(i,1);else if(st.seats.length<8)st.seats.push(d.seat);else alert("You can book up to 8 seats at a time.");step2()}
else if("pay"in d)done();
else if(t.id=="mytix")mine()});
renderChips();renderGrid();count();
</script>
</body>
</html>
